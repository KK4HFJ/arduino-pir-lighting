name: CI
on: [push, pull_request]

jobs:
  arduino-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn: [arduino:avr:uno, arduino:avr:nano]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          sketch-paths: |
            - firmware/PirLight
